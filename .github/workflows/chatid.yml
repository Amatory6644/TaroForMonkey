name: Telegram scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "src/chatid_bot.py"
      - ".github/workflows/chatid.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-chatid-command
  cancel-in-progress: false

jobs:
  chatid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Command polling moved to the local Telok assistant.
      - name: Process Telegram commands
        if: ${{ false }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python src/chatid_bot.py

      - name: Dispatch meme workflow every scheduled run
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Dispatching meme workflow for 5-minute scheduler test"
          gh workflow run meme.yml --ref main

      - name: Save Telegram update offset
        if: ${{ false }}
        shell: bash
        run: |
          if git diff --quiet -- data/telegram_update_state.json; then
            echo "No Telegram state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram_update_state.json
          git commit -m "Update Telegram command offset"
          git pull --rebase origin main
          git push origin HEAD:main

name: Send manual tarot to Telegram

on:
  push:
    branches:
      - main
    paths:
      - "data/manual_message.txt"
      - ".github/workflows/manual-tarot.yml"
  workflow_dispatch:

jobs:
  send-manual-tarot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send manual tarot message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          chat_ids = [chat_id, "-5577576013"]
          text = Path("data/manual_message.txt").read_text(encoding="utf-8")

          for target_chat_id in chat_ids:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": target_chat_id, "text": text},
                  timeout=30,
              )
              response.raise_for_status()
              result = response.json()
              if not result.get("ok"):
                  raise RuntimeError(
                      f"Telegram Bot API rejected message for {target_chat_id}."
                  )
          PY

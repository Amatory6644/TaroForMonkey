name: Popular meme to Telegram every 30 minutes

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: popular-meme-telegram
  cancel-in-progress: false

jobs:
  send-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Find and send popular meme
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/meme_bot.py

      - name: Save sent-meme history
        shell: bash
        run: |
          if git diff --quiet -- data/meme_history.json; then
            echo "History did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meme_history.json
          git commit -m "Update meme history"
          git pull --rebase origin main
          git push origin HEAD:main

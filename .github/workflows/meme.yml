name: Hourly popular meme to Telegram

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/meme_bot.py"
      - ".github/workflows/meme.yml"
      - "data/meme_trigger.txt"

permissions:
  contents: write

concurrency:
  group: hourly-popular-meme
  cancel-in-progress: false

jobs:
  send-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Find and send popular meme
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/meme_bot.py

      - name: Save sent-meme history
        shell: bash
        run: |
          if git diff --quiet -- data/meme_history.json; then
            echo "History did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meme_history.json
          git commit -m "Update meme history"
          git pull --rebase origin main
          git push origin HEAD:main

name: Telok assistant validation
on:
  push:
    branches: [telok-assistant]
    paths: ['telok-assistant/**', '.github/workflows/telok-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: telok
          POSTGRES_PASSWORD: telok-local-only
          POSTGRES_DB: postgres
        ports: ['54391:5432']
        options: --health-cmd "pg_isready -U telok" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: telok-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telok-assistant/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check telok tests scripts
      - run: python -m pytest -q --timeout 90
